# Dependabot 設定
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# 既存設定は open-pull-requests-limit: 0 でバージョン更新を止めていた。
# PR が乱立するのを避けるための措置だったが、minor/patch をグループ化すれば
# 本数は抑えられるため、上限を設けたうえで更新を再開する。
# 今回あらたに対象へ追加するエコシステム: github-actions, pip
#
# 方針: minor/patch はグループ化して 1 PR にまとめ、major は個別 PR で判断する。
#       リリース直後の不具合や yank を踏まないよう cooldown で寝かせてから PR を出す。

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Python (pip / requirements.txt)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # npm
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # GitHub Actions (.github/workflows)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
